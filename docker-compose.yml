services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veille
      POSTGRES_USER: veille
      POSTGRES_PASSWORD: veille
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/l00/schema/tranche-1.sql:/docker-entrypoint-initdb.d/01-tranche-1.sql:ro
      - ./docs/l00/schema/rls-tranche-1.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veille -d veille"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: veille
      MINIO_ROOT_PASSWORD: veilleminio
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    image: php:8.3-cli
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://veille:veille@postgres:5432/veille?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MAILER_DSN: smtp://mailpit:1025
      APP_ENV: dev
      APP_SECRET: change_me_in_local_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: php -S 0.0.0.0:8000 -t public
    profiles: ["app"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    profiles: ["app"]

volumes:
  postgres_data:
  minio_data:
